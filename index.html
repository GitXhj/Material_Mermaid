    /* ============ 设计令牌 - Material Design 3 ============ */
    :root {

    .app-bar-right {

    /* ============ 按钮 ============ */
    .icon-button {

      justify-content: center;

    .icon-button:hover {

    .icon-button:active {

    .filled-button {

    .filled-button:hover { box-shadow: var(--elevation-3); }
    .filled-button:active { transform: scale(0.97); box-shadow: var(--elevation-1); }
    .filled-button .material-symbols-outlined { font-size: 20px; }
    
    .tonal-button {

    .tonal-button:hover { box-shadow: var(--elevation-2); }
    .tonal-button:active { transform: scale(0.97); }
    .tonal-button .material-symbols-outlined { font-size: 18px; }
    
    .text-button {
      height: 40px;
      padding: 0 12px;
      border-radius: var(--radius-full);
      color: var(--md-primary);
      font-weight: 600;
      font-size: 13px;

      white-space: nowrap;
    }
    
    .text-button:hover { background: var(--md-surface-container-high); }
    .text-button .material-symbols-outlined { font-size: 18px; }
    
    /* ============ 主内容 ============ */
    .main-content {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(360px, 1fr) 1.4fr;
      gap: 16px;
      padding: 16px;
      max-width: 1920px;
      margin: 0 auto;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    
    /* ============ 卡片 ============ */
    .panel {
      background: var(--md-surface-container-low);
      border-radius: var(--radius-lg);
      box-shadow: var(--elevation-1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: box-shadow 0.3s var(--motion-standard);
      animation: fadeUp 0.5s var(--motion-decelerated) backwards;
    }
    
    .panel:nth-child(1) { animation-delay: 0.1s; }
    .panel:nth-child(2) { animation-delay: 0.2s; }
    
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .panel:hover { box-shadow: var(--elevation-2); }
    
    .panel-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;

    .panel-actions {

      align-items: center;

      flex-wrap: wrap;
    }
    
    /* ============ 编辑器 ============ */
    .editor-container {
      flex: 1;
      display: flex;
      background: var(--md-surface-container-lowest);
      overflow: hidden;
      position: relative;
      min-height: 0;
    }
    
    .line-numbers {
      flex-shrink: 0;
      padding: 16px 12px 16px 16px;
      background: var(--md-surface-container-low);
      color: var(--md-on-surface-variant);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.7;
      text-align: right;
      user-select: none;
      overflow: hidden;
      min-width: 52px;
      border-right: 1px solid var(--md-outline-variant);
      opacity: 0.7;
    }
    
    .line-numbers div { height: 1.7em; }
    
    #editor {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      padding: 16px;
      background: transparent;
      color: var(--md-on-surface);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.7;
      tab-size: 2;
      white-space: pre;
      overflow: auto;

    #editor::placeholder { color: var(--md-on-surface-variant); opacity: 0.5; }
    #editor::selection { background: var(--md-primary-container); color: var(--md-on-primary-container); }
    
    .editor-footer {
      padding: 10px 20px;
      background: var(--md-surface-container);
      border-top: 1px solid var(--md-outline-variant);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--md-on-surface-variant);
    }
    
    .editor-hint { display: flex; align-items: center; gap: 6px; }
    .editor-hint .material-symbols-outlined { font-size: 16px; }
    
    kbd {
      background: var(--md-surface-container-highest);
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--radius-xs);
      padding: 2px 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--md-on-surface);
    }
    
    .char-count { color: var(--md-on-surface-variant); font-family: var(--font-mono); }
    
    /* ============ 预览 ============ */
    .preview-container {
      flex: 1;
      background: var(--md-surface-container-lowest);
      overflow: auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 0;
      background-image:

        linear-gradient(-45deg, var(--md-surface-container-low) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--md-surface-container-low) 75%),
        linear-gradient(-45deg, transparent 75%, var(--md-surface-container-low) 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }
    
    .preview-content {
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      transition: transform 0.25s var(--motion-emphasized);
      max-width: 100%;
      position: relative;
      background: var(--md-surface-container-lowest);
      border-radius: var(--radius-md);
      box-shadow: var(--elevation-2);
      padding: 20px;
    }
    
    .preview-content svg { max-width: 100%; height: auto; display: block; }
    
    .preview-content.fade-in { animation: fadeInScale 0.5s var(--motion-emphasized); }
    
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    
    .zoom-controls {
      display: flex;
      align-items: center;
      background: var(--md-surface-container-high);
      border-radius: var(--radius-full);
      padding: 2px;
      gap: 0;
    }
    
    .zoom-controls .icon-button { width: 36px; height: 36px; }
    
    .zoom-level {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--md-on-surface);
      min-width: 48px;
      text-align: center;
      padding: 0 4px;
    }
    
    .download-controls { display: flex; gap: 6px; }
    
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(251, 253, 249, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s var(--motion-standard);
    }
    
    [data-theme="dark"] .loading-overlay { background: rgba(25, 28, 28, 0.85); }
    
    .loading-overlay.visible { opacity: 1; pointer-events: auto; }
    
    .circular-progress {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 4px solid var(--md-surface-container-highest);
      border-top-color: var(--md-primary);
      animation: spin 0.9s linear infinite;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .loading-overlay p { font-size: 14px; color: var(--md-on-surface-variant); font-weight: 500; }
    
    .error-message {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;

      color: var(--md-on-error-container);

      font-family: var(--font-mono);
      line-height: 1.5;
      box-shadow: var(--elevation-3);
      max-height: 200px;
      overflow-y: auto;
      display: none;
      animation: errorSlide 0.3s var(--motion-emphasized);
      white-space: pre-wrap;
      word-break: break-word;
    }
    
    .error-message.visible { display: block; }
    
    @keyframes errorSlide {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .empty-state .material-symbols-outlined { font-size: 64px; opacity: 0.3; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    .scrim {

      inset: 0;
      background: rgba(0, 0, 0, 0.5);

      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s var(--motion-standard);

    .scrim.visible { opacity: 1; pointer-events: auto; }

      right: 0;
      bottom: 0;
      width: 360px;
      max-width: 90vw;

      z-index: 201;

      display: flex;
      flex-direction: column;
      box-shadow: var(--elevation-5);

      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--md-outline-variant);
      background: var(--md-surface-container);

      font-weight: 600;
      color: var(--md-on-surface-variant);
      letter-spacing: 0.02em;
    }
    
    .select-wrapper { position: relative; }
    
    .select-wrapper::after {
      content: 'expand_more';
      font-family: 'Material Symbols Outlined';
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--md-on-surface-variant);
      font-size: 20px;
    }
    
    select {
      width: 100%;
      height: 48px;
      padding: 0 40px 0 16px;
      border-radius: var(--radius-sm);
      background: var(--md-surface-container-lowest);
      border: 1px solid var(--md-outline);
      color: var(--md-on-surface);
      font-family: inherit;
      font-size: 14px;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    
    select:hover { border-color: var(--md-on-surface); }
    select:focus { border-color: var(--md-primary); border-width: 2px; padding: 0 39px 0 15px; outline: none; }
    
    .color-input { display: flex; gap: 8px; align-items: center; }
    
    .color-input input[type="color"] {
      width: 48px;
      height: 48px;
      border: 1px solid var(--md-outline);
      border-radius: var(--radius-sm);
      cursor: pointer;
      background: var(--md-surface-container-lowest);
      padding: 4px;
    }
    
    .color-input input[type="text"] {
      flex: 1;
      height: 48px;
      padding: 0 16px;
      border-radius: var(--radius-sm);
      background: var(--md-surface-container-lowest);
      border: 1px solid var(--md-outline);
      color: var(--md-on-surface);
      font-family: var(--font-mono);
      font-size: 14px;
      transition: border-color 0.2s;
    }
    
    .color-input input[type="text"]:focus { border-color: var(--md-primary); border-width: 2px; padding: 0 15px; outline: none; }
    
    input[type="range"] {
      width: 100%;
      height: 32px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: pointer;
    }
    
    input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: var(--md-surface-container-highest); border-radius: 2px; }
    input[type="range"]::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; background: var(--md-primary); border-radius: 50%; margin-top: -8px; border: none; box-shadow: var(--elevation-1); }
    input[type="range"]::-moz-range-track { height: 4px; background: var(--md-surface-container-highest); border-radius: 2px; }
    input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; background: var(--md-primary); border-radius: 50%; border: none; box-shadow: var(--elevation-1); }
    
    .example-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    .example-item {
      height: 44px;
      padding: 0 12px;
      border-radius: var(--radius-md);
      background: var(--md-surface-container);
      color: var(--md-on-surface);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s, transform 0.15s;
      border: 1px solid var(--md-outline-variant);
    }
    
    .example-item:hover { background: var(--md-surface-container-high); }
    .example-item:active { transform: scale(0.97); }
    .example-item .material-symbols-outlined { font-size: 18px; color: var(--md-primary); }
    
    .drawer-footer {
      padding: 20px;
      border-top: 1px solid var(--md-outline-variant);
      background: var(--md-surface-container);
    }
    
    .filled-button.full { width: 100%; justify-content: center; }
    
    /* ============ Toast ============ */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 100px);
      background: var(--md-on-surface);
      color: var(--md-surface);
      padding: 12px 20px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      box-shadow: var(--elevation-4);
      z-index: 300;
      opacity: 0;
      transition: transform 0.3s var(--motion-emphasized), opacity 0.3s var(--motion-standard);
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 90vw;
      pointer-events: none;
    }
    
    .toast.visible { transform: translate(-50%, 0); opacity: 1; }
    .toast.success { background: var(--md-success); color: #fff; }
    .toast.error { background: var(--md-error); color: var(--md-on-error); }
    .toast .material-symbols-outlined { font-size: 18px; }
    
    /* ============ 响应式 ============ */
    @media (max-width: 1024px) {
      .main-content { grid-template-columns: 1fr; grid-template-rows: minmax(360px, 1fr) minmax(360px, 1fr); }
      .app-title h1 { font-size: 16px; }
    }
    
    @media (max-width: 768px) {
      .app-bar { padding: 10px 12px; }
      .app-title .subtitle { display: none; }
      .app-title h1 { font-size: 15px; }
      .app-title .logo { width: 36px; height: 36px; font-size: 20px; }
      .main-content { padding: 12px; gap: 12px; }
      .panel-header { padding: 12px 14px; }
      .panel-header h2 { font-size: 14px; }
      .panel-actions { gap: 6px; }
      .tonal-button { height: 36px; padding: 0 12px; font-size: 12px; }
      .tonal-button .material-symbols-outlined { font-size: 16px; }
      .filled-button { height: 40px; padding: 0 16px; font-size: 13px; }
      .text-button { height: 36px; padding: 0 8px; font-size: 12px; }
      .text-button span:not(.material-symbols-outlined) { display: none; }
      #editor { font-size: 12px; padding: 12px; }
      .line-numbers { font-size: 12px; padding: 12px 8px 12px 12px; min-width: 40px; }
      .editor-footer { padding: 8px 12px; font-size: 11px; }
      .editor-hint span:not(.material-symbols-outlined):not(kbd) { display: none; }
      .preview-container { padding: 12px; }
      .zoom-controls .icon-button { width: 32px; height: 32px; }
      .zoom-level { min-width: 40px; font-size: 11px; }
      .download-controls .tonal-button span:not(.material-symbols-outlined) { display: none; }
      .download-controls .tonal-button { padding: 0 10px; }
    }
    
    @media (max-width: 480px) {
      .app-title h1 { font-size: 14px; }
      .panel-header { flex-direction: column; align-items: flex-start; gap: 8px; }
      .panel-actions { width: 100%; justify-content: space-between; }
    }
    
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--md-outline-variant); border-radius: 5px; border: 2px solid var(--md-surface); }
    ::-webkit-scrollbar-thumb:hover { background: var(--md-outline); }
    
    button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--md-primary);
      outline-offset: 2px;
    }
    
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="app-bar" role="banner">

      </div>
      <div class="editor-container">

  <aside class="config-drawer" id="configDrawer" aria-label="配置面板" aria-hidden="true">

  <div class="scrim" id="scrim"></div>
  
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  
  <script>
    'use strict';
    
    const state = {
      mermaidLoaded: false,
      currentZoom: 100,
      config: {
        theme: 'default',
        curve: 'basis',
        bgColor: '#ffffff',
        fontSize: 16,
        exportScale: 2
      }
    };
    
    const $ = (id) => document.getElementById(id);
    const editor = $('editor');
    const lineNumbers = $('lineNumbers');
    const preview = $('preview');
    const previewContainer = $('previewContainer');
    const loadingOverlay = $('loadingOverlay');
    const errorMessage = $('errorMessage');
    const zoomLevelEl = $('zoomLevel');
    const toast = $('toast');
    const charCount = $('charCount');
    const configDrawer = $('configDrawer');
    const scrim = $('scrim');
    
    const examples = {
      flowchart: `flowchart TD
    A[用户访问页面] --> B{是否已登录?}
    B -- 是 --> C[加载用户数据]
    B -- 否 --> D[跳转登录页]
    D --> E[输入账号密码]
    E --> F{验证成功?}
    F -- 是 --> C
    F -- 否 --> D
    C --> G[渲染首页内容]
    G --> H[结束]
    
    style A fill:#006A6B,stroke:#004D4E,color:#fff
    style H fill:#4CDAD4,stroke:#006A6B,color:#003735
    style F fill:#E65100,stroke:#BF360C,color:#fff`,
      sequence: `sequenceDiagram
    participant U as 用户
    participant F as 前端
    participant B as 后端API
    participant D as 数据库
    participant C as 缓存
    
    U->>F: 发起请求
    activate F
    F->>C: 查询缓存
    activate C
    C-->>F: 缓存未命中
    deactivate C
    F->>B: API调用
    activate B
    B->>D: 查询数据
    activate D
    D-->>B: 返回数据
    deactivate D
    B->>C: 写入缓存
    activate C
    C-->>B: 缓存完成
    deactivate C
    B-->>F: 响应结果
    deactivate B
    F-->>U: 显示数据
    deactivate F
    
    Note over U,D: 完整的请求-响应流程`,
      class: `classDiagram
    direction LR
    class Animal {
      +String name
      +int age
      +eat() void
      +sleep() void
    }
    class Dog {
      +String breed
      +bark() void

      +String color

    class Owner {

    }
    
    Animal <|-- Dog
    Animal <|-- Cat
    Owner "1" --> "*" Animal : owns`,
      state: `stateDiagram-v2
    [*] --> 待机
    待机 --> 处理中: 收到请求
    处理中 --> 成功: 处理完成
    处理中 --> 失败: 处理出错

    成功 --> [*]

    note right of 处理中: 此状态可被中断
    note left of 失败: 自动重试3次后放弃`,

    title 项目开发计划

    section 需求阶段

    需求评审     :a2, after a1, 3d
    
    section 设计阶段
    系统设计     :a3, after a2, 10d
    UI设计       :a4, after a2, 7d
    设计评审     :a5, after a3, 2d
    
    section 开发阶段

    上线部署     :a11, after a10, 2d`,
      pie: `pie title 2024年开发者使用编辑器比例
    "VS Code" : 65.3

    CUSTOMER {

    }

      journey: `journey
    title 用户购物体验旅程
    section 浏览阶段
      访问首页: 5: 用户

    section 决策阶段

    };
    
    function loadScript(src, timeout = 15000) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.async = true;
        let settled = false;
        
        const timer = setTimeout(() => {
          if (!settled) {
            settled = true;
            reject(new Error('加载超时'));
            script.remove();
          }
        }, timeout);
        
        script.onload = () => {
          if (!settled) {
            settled = true;
            clearTimeout(timer);
            resolve();
          }
        };
        
        script.onerror = () => {
          if (!settled) {
            settled = true;
            clearTimeout(timer);
            reject(new Error('加载失败'));
            script.remove();
          }
        };
        
        document.head.appendChild(script);
      });
    }
    
    let toastTimer;
    function showToast(message, type = 'info') {
      clearTimeout(toastTimer);
      const icons = { success: 'check_circle', error: 'error', info: 'info' };
      toast.innerHTML = `<span class="material-symbols-outlined">${icons[type] || icons.info}</span><span>${message}</span>`;
      toast.className = `toast visible ${type}`;
      toastTimer = setTimeout(() => { toast.classList.remove('visible'); }, 2800);
    }
    
    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.add('visible');
    }
    
    function hideError() { errorMessage.classList.remove('visible'); }
    
    // ============ Mermaid 加载 - 使用指定的 CDN ============
    async function loadMermaid() {
      const cdnUrls = [
        'https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js',
        'https://unpkg.com/mermaid@10.9.0/dist/mermaid.min.js',
        'https://cdn.bootcdn.net/ajax/libs/mermaid/10.6.1/mermaid.min.js'
      ];
      
      for (const url of cdnUrls) {
        try {
          await loadScript(url, 12000);
          if (typeof mermaid !== 'undefined') {
            state.mermaidLoaded = true;
            return true;
          }
        } catch (e) {
          console.warn(`Mermaid CDN 加载失败 (${url}):`, e.message);
        }
      }
      return false;
    }
    
    function initMermaid() {
      if (!state.mermaidLoaded) return;
      mermaid.initialize({
        startOnLoad: false,
        theme: state.config.theme,
        securityLevel: 'loose',
        flowchart: {
          curve: state.config.curve,
          useMaxWidth: true,
          htmlLabels: true
        },
        themeVariables: {
          fontSize: state.config.fontSize + 'px',
          fontFamily: 'Manrope, sans-serif'
        }
      });
    }
    
    let renderId = 0;
    
    async function render() {
      if (!state.mermaidLoaded) {
        showToast('Mermaid 库尚未加载完成，请稍候', 'error');
        return;
      }
      
      const code = editor.value.trim();
      if (!code) {
        showError('请输入 Mermaid 代码后再渲染');
        showToast('代码为空', 'error');
        return;
      }
      
      hideError();
      loadingOverlay.classList.add('visible');
      const currentRenderId = ++renderId;
      
      try {
        initMermaid();
        const id = `mermaid-svg-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
        const { svg } = await mermaid.render(id, code);
        
        if (currentRenderId !== renderId) return;
        
        preview.innerHTML = svg;
        preview.style.background = state.config.bgColor;
        applyZoom();
        
        preview.classList.remove('fade-in');
        void preview.offsetWidth;
        preview.classList.add('fade-in');
        
        showToast('渲染成功', 'success');
      } catch (err) {
        if (currentRenderId !== renderId) return;
        const msg = formatError(err);
        showError(msg);
        showToast('渲染失败，请检查代码', 'error');
        console.error('Mermaid 渲染错误:', err);
      } finally {
        if (currentRenderId === renderId) {
          loadingOverlay.classList.remove('visible');
        }
      }
    }
    
    function formatError(err) {
      let msg = err.message || String(err);
      if (msg.includes('\n    at ')) msg = msg.split('\n    at ')[0];
      if (msg.includes('Parse error')) msg = '语法解析错误：' + msg;
      return msg;
    }
    
    function updateLineNumbers() {
      const lines = editor.value.split('\n').length;
      const minLines = 20;
      const totalLines = Math.max(lines, minLines);
      let html = '';
      for (let i = 1; i <= totalLines; i++) html += `<div>${i}</div>`;
      lineNumbers.innerHTML = html;
      charCount.textContent = `${editor.value.length} 字符 · ${lines} 行`;
    }
    
    function syncScroll() { lineNumbers.scrollTop = editor.scrollTop; }
    
    function applyZoom() {
      preview.style.transform = `scale(${state.currentZoom / 100})`;
      zoomLevelEl.textContent = state.currentZoom + '%';
    }
    
    function setZoom(level) {
      state.currentZoom = Math.max(25, Math.min(200, level));
      applyZoom();
    }
    
    function downloadSVG() {
      const svgEl = preview.querySelector('svg');
      if (!svgEl) { showToast('请先渲染图表', 'error'); return; }
      
      try {
        const cloned = svgEl.cloneNode(true);
        cloned.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        cloned.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
        cloned.removeAttribute('transform');
        
        if (state.config.bgColor && state.config.bgColor !== 'transparent') {
          const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          bgRect.setAttribute('width', '100%');
          bgRect.setAttribute('height', '100%');
          bgRect.setAttribute('fill', state.config.bgColor);
          cloned.insertBefore(bgRect, cloned.firstChild);
        }
        
        const svgData = new XMLSerializer().serializeToString(cloned);
        const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + svgData], { type: 'image/svg+xml;charset=utf-8' });
        triggerDownload(blob, `mermaid-${formatTimestamp()}.svg`);
        showToast('SVG 已下载', 'success');
      } catch (e) {
        console.error(e);
        showToast('SVG 下载失败', 'error');
      }
    }
    
    async function downloadImage(format) {
      const svgEl = preview.querySelector('svg');
      if (!svgEl) { showToast('请先渲染图表', 'error'); return; }
      
      try {
        const cloned = svgEl.cloneNode(true);
        cloned.removeAttribute('transform');
        
        const bbox = svgEl.getBoundingClientRect();
        let width = parseFloat(svgEl.getAttribute('width')) || bbox.width || 800;
        let height = parseFloat(svgEl.getAttribute('height')) || bbox.height || 600;
        
        const viewBox = svgEl.getAttribute('viewBox');
        if (viewBox) {
          const parts = viewBox.split(/\s+/);
          if (parts.length === 4) {
            const vbW = parseFloat(parts[2]);
            const vbH = parseFloat(parts[3]);
            if (vbW > 0 && vbH > 0) { width = vbW; height = vbH; }
          }
        }
        
        cloned.setAttribute('width', width);
        cloned.setAttribute('height', height);
        cloned.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        
        if (format === 'jpg' || (state.config.bgColor && state.config.bgColor !== 'transparent')) {
          const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          bgRect.setAttribute('width', '100%');
          bgRect.setAttribute('height', '100%');
          bgRect.setAttribute('fill', state.config.bgColor || '#ffffff');
          cloned.insertBefore(bgRect, cloned.firstChild);
        }
        
        const svgData = new XMLSerializer().serializeToString(cloned);
        const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);
        
        const img = new Image();
        img.decoding = 'async';
        
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error('SVG 转图片失败'));
          img.src = url;
        });
        
        const scale = state.config.exportScale;
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(width * scale));
        canvas.height = Math.max(1, Math.round(height * scale));
        const ctx = canvas.getContext('2d');
        
        if (format === 'jpg') {
          ctx.fillStyle = state.config.bgColor || '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        
        const mime = format === 'png' ? 'image/png' : 'image/jpeg';
        const quality = format === 'jpg' ? 0.95 : undefined;
        
        canvas.toBlob(blob => {
          if (!blob) { showToast('图片生成失败', 'error'); return; }
          triggerDownload(blob, `mermaid-${formatTimestamp()}.${format}`);
          showToast(`${format.toUpperCase()} 已下载 (${scale}x)`, 'success');
        }, mime, quality);
      } catch (e) {
        console.error('图片下载失败:', e);
        showToast(`${format.toUpperCase()} 下载失败: ${e.message}`, 'error');
      }
    }
    
    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    
    function formatTimestamp() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
    }
    
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const newTheme = current === 'dark' ? 'light' : 'dark';
      applyTheme(newTheme);
      localStorage.setItem('mermaid-theme', newTheme);
    }
    
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
      const icon = document.querySelector('#themeBtn .material-symbols-outlined');
      icon.textContent = theme === 'dark' ? 'light_mode' : 'dark_mode';
      const title = theme === 'dark' ? '切换到浅色模式' : '切换到深色模式';
      $('themeBtn').setAttribute('title', title);
      $('themeBtn').setAttribute('aria-label', title);
    }
    
    function openDrawer() {
      configDrawer.classList.add('open');
      configDrawer.setAttribute('aria-hidden', 'false');
      scrim.classList.add('visible');
    }
    
    function closeDrawer() {
      configDrawer.classList.remove('open');
      configDrawer.setAttribute('aria-hidden', 'true');
      scrim.classList.remove('visible');
    }
    
    function loadFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      if (code) {
        try {
          editor.value = decodeURIComponent(code);
          return true;
        } catch (e) { console.warn('URL 代码解码失败:', e); }
      }
      return false;
    }
    
    let touchState = { distance: 0, zoom: 100 };
    
    previewContainer.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        touchState.distance = Math.sqrt(dx * dx + dy * dy);
        touchState.zoom = state.currentZoom;
      }
    }, { passive: true });
    
    previewContainer.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const ratio = distance / Math.max(1, touchState.distance);
        const newZoom = Math.round(touchState.zoom * ratio / 5) * 5;
        setZoom(newZoom);
      }
    }, { passive: false });
    
    editor.addEventListener('input', updateLineNumbers);
    editor.addEventListener('scroll', syncScroll);
    
    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
        updateLineNumbers();
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        render();
      }
    });
    
    $('renderBtn').addEventListener('click', render);
    
    $('clearBtn').addEventListener('click', () => {
      if (editor.value.trim() && !confirm('确定要清空代码吗？')) return;
      editor.value = '';
      preview.innerHTML = '<div class="empty-state"><span class="material-symbols-outlined">image</span><p>代码已清空</p></div>';
      updateLineNumbers();
      showToast('已清空');
    });
    
    $('zoomInBtn').addEventListener('click', () => setZoom(state.currentZoom + 25));
    $('zoomOutBtn').addEventListener('click', () => setZoom(state.currentZoom - 25));
    $('resetZoomBtn').addEventListener('click', () => setZoom(100));
    
    document.querySelectorAll('[data-format]').forEach(btn => {
      btn.addEventListener('click', () => {
        const format = btn.dataset.format;
        if (format === 'svg') downloadSVG();
        else downloadImage(format);
      });
    });
    
    $('themeBtn').addEventListener('click', toggleTheme);
    $('settingsBtn').addEventListener('click', openDrawer);
    $('closeDrawerBtn').addEventListener('click', closeDrawer);
    scrim.addEventListener('click', closeDrawer);
    
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && configDrawer.classList.contains('open')) closeDrawer();
    });
    
    document.querySelectorAll('.example-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.example;
        if (examples[type]) {
          editor.value = examples[type];
          updateLineNumbers();
          closeDrawer();
          render();
        }
      });
    });
    
    $('themeSelect').addEventListener('change', (e) => { state.config.theme = e.target.value; });
    $('curveSelect').addEventListener('change', (e) => { state.config.curve = e.target.value; });
    $('bgColorInput').addEventListener('input', (e) => {
      state.config.bgColor = e.target.value;
      $('bgColorText').value = e.target.value;
    });
    $('bgColorText').addEventListener('input', (e) => {
      const val = e.target.value;
      if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
        state.config.bgColor = val;
        $('bgColorInput').value = val;
      }
    });
    $('fontSizeRange').addEventListener('input', (e) => {
      state.config.fontSize = parseInt(e.target.value);
      $('fontSizeValue').textContent = e.target.value + 'px';
    });
    $('scaleRange').addEventListener('input', (e) => {
      state.config.exportScale = parseInt(e.target.value);
      $('scaleValue').textContent = e.target.value + 'x';
    });
    $('applyConfigBtn').addEventListener('click', () => { closeDrawer(); render(); });
    
    previewContainer.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const delta = e.deltaY > 0 ? -10 : 10;
        setZoom(state.currentZoom + delta);
      }
    }, { passive: false });
    
    async function init() {
      const savedTheme = localStorage.getItem('mermaid-theme');
      if (savedTheme) applyTheme(savedTheme);
      else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) applyTheme('dark');
      
      if (!loadFromUrl()) editor.value = examples.flowchart;
      updateLineNumbers();
      
      showToast('正在加载 Mermaid 库...', 'info');
      
      const loaded = await loadMermaid();
      
      if (!loaded) {
        showError('Mermaid 库加载失败！\n\n请检查您的网络连接后刷新页面重试。\n如果问题持续，请尝试使用其他网络环境。');
        showToast('Mermaid 加载失败', 'error');
        return;
      }
      
      initMermaid();
      showToast('Mermaid 已就绪', 'success');
      render();
    }
    
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        if (!localStorage.getItem('mermaid-theme')) applyTheme(e.matches ? 'dark' : 'light');
      });
    }
    
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  </script>
</body>
</html>
